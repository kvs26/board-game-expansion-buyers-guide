<!doctype html><html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@500;700&display=block">
<style>*{box-sizing:border-box;margin:0;padding:0}html,body{width:1080px;height:1440px;overflow:hidden}
body{background:#141414;color:#fff;font-family:Inter,sans-serif;position:relative}
.wrap{position:absolute;inset:0;padding:60px 50px 50px;display:flex;flex-direction:column}
h1{font:400 84px/1.03 "Archivo Black";text-transform:uppercase}
h1 em{font-style:normal;color:#FFDF7F}
h1 small{display:block;margin-top:14px;font-size:46px;color:#9a9a9a}
.board{margin-top:36px;border:4px solid #000;display:flex;flex-direction:column;background:#1f1f1f}
.tr{display:grid;grid-template-columns:170px 1fr;border-bottom:4px solid #000;min-height:190px}
.tr:last-child{border:0}
.lb{display:grid;place-items:center;color:#000;font:400 78px "Archivo Black";text-align:center}
.cell{display:flex;align-items:center;gap:20px;padding:14px 26px;flex-wrap:wrap}
.pool{margin-top:34px;display:flex;gap:22px;flex-wrap:wrap;align-items:center;border:4px dashed #555;border-radius:24px;padding:26px}
.chip{display:flex;align-items:center;gap:16px;background:#fff;color:#111;border-radius:22px;padding:12px 28px 12px 16px;font:400 40px "Archivo Black";box-shadow:0 8px 0 #000}
.chip .mp{width:68px;height:68px}
.drag{margin-top:26px;font:700 42px Inter;color:#FFDF7F}
.foot{margin-top:auto;display:flex;justify-content:space-between;font:700 34px Inter;color:#9a9a9a}
.note{font:700 38px/1.15 Inter;color:#fff}
.note small{display:block;font:500 28px Inter;color:#9a9a9a;margin-top:4px}
.info .tr{flex:1}
.info .board{flex:1}
.info .chip{font-size:44px}
</style></head>
<body class="ig info">
<div class="wrap"><h1 style="font-size:70px">Seafarers<br>or <em>Cities &amp; Knights?</em></h1>
<div class="board"><div class="tr"><div class="lb" style="background:#FF7F7F">S</div><div class="cell" style="flex-direction:column;align-items:flex-start;justify-content:center;gap:12px"><div class="chip"><svg class="mp" style="" viewBox="0 0 100 100"><path d="M50 6C60 6 66 13 66 21c0 6-3 10-7 13 11 2 22 5 34 3 4 0 5 5 2 8-7 6-15 9-23 10 4 10 10 22 18 32 2 4 0 7-5 7H60c-5 0-8-5-10-12-2 7-5 12-10 12H15c-5 0-7-3-5-7 8-10 14-22 18-32-8-1-16-4-23-10-3-3-2-8 2-8 12 2 23-1 34-3-4-3-7-7-7-13C34 13 40 6 50 6Z" fill="#2B59C3" stroke="#111" stroke-width="5" stroke-linejoin="round"/></svg><span>Seafarers</span></div><div class="note">Buy first if:<small>Base Catan feels too small</small></div></div></div><div class="tr"><div class="lb" style="background:#FFBF7F">A</div><div class="cell" style="flex-direction:column;align-items:flex-start;justify-content:center;gap:12px"><div class="chip"><svg class="mp" style="" viewBox="0 0 100 100"><path d="M50 6C60 6 66 13 66 21c0 6-3 10-7 13 11 2 22 5 34 3 4 0 5 5 2 8-7 6-15 9-23 10 4 10 10 22 18 32 2 4 0 7-5 7H60c-5 0-8-5-10-12-2 7-5 12-10 12H15c-5 0-7-3-5-7 8-10 14-22 18-32-8-1-16-4-23-10-3-3-2-8 2-8 12 2 23-1 34-3-4-3-7-7-7-13C34 13 40 6 50 6Z" fill="#E5531F" stroke="#111" stroke-width="5" stroke-linejoin="round"/></svg><span>Cities &amp; Knights</span></div><div class="note">Buy later if:<small>You know base Catan cold</small></div></div></div><div class="tr"><div class="lb" style="background:#BFFF7F">C</div><div class="cell" style="flex-direction:column;align-items:flex-start;justify-content:center;gap:12px"><div class="chip"><svg class="mp" style="" viewBox="0 0 100 100"><path d="M50 6C60 6 66 13 66 21c0 6-3 10-7 13 11 2 22 5 34 3 4 0 5 5 2 8-7 6-15 9-23 10 4 10 10 22 18 32 2 4 0 7-5 7H60c-5 0-8-5-10-12-2 7-5 12-10 12H15c-5 0-7-3-5-7 8-10 14-22 18-32-8-1-16-4-23-10-3-3-2-8 2-8 12 2 23-1 34-3-4-3-7-7-7-13C34 13 40 6 50 6Z" fill="#777" stroke="#111" stroke-width="5" stroke-linejoin="round"/></svg><span>Both</span></div><div class="note">Skip both if:<small>You still argue about the robber</small></div></div></div></div>

<script>window.__info={fonts:[]};document.fonts.ready.then(()=>{window.__info.fonts=["40px \"Archivo Black\"","700 30px Inter"].map(f=>[f,document.fonts.check(f)])});</script>
</body></html>
